name: Hourly Crypto Market Scanner

on:
  schedule:
    # Runs automatically at minute 0 of every hour 24/7
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  run-scanners:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Grants permission to push database commits back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy tradingview-screener

      - name: Run Option A Scan
        run: python bot_option_a_futures.py

      - name: Run Option C Scan
        run: python bot_option_c_futures.py

      - name: Auto-Commit Database Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add crypto_trading_data.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update crypto trading signals DB [skip ci]" && git push)
